<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Tehalka Quotes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f9;
    color:#222;
}

header{
    background:#17181d;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:25px;
}

header span{
    color:#ffd54a;
}

.container{
    max-width:700px;
    margin:25px auto;
    padding:0 16px 50px;
}

.admin-box{
    background:white;
    border-radius:20px;
    padding:24px;
    box-shadow:0 7px 25px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    margin-bottom:8px;
}

.title p{
    color:#777;
    font-size:14px;
}

label{
    display:block;
    font-weight:bold;
    margin:18px 0 8px;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    font-family:inherit;
}

textarea{
    min-height:170px;
    resize:vertical;
    line-height:1.7;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#6a11cb;
}

.publish-btn{
    width:100%;
    border:0;
    background:#6a11cb;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:22px;
}

.publish-btn:hover{
    background:#5310a1;
}

.clear-btn{
    width:100%;
    border:0;
    background:#eee;
    color:#333;
    padding:13px;
    border-radius:12px;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    font-weight:bold;
}

.preview{
    display:none;
    margin-top:30px;
}

.preview h3{
    margin-bottom:12px;
}

/* QUOTE IMAGE */

.quote-image{
    width:100%;
    aspect-ratio:1/1;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    padding:35px;
}

.quote-image::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(255,255,255,.18),
            transparent 30%
        );
}

.quote-content{
    position:relative;
    z-index:2;
    width:100%;
}

.quote-brand{
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:35px;
}

.quote-category{
    display:inline-block;
    padding:7px 15px;
    border-radius:30px;
    background:rgba(255,255,255,.18);
    font-size:13px;
    margin-bottom:25px;
}

.quote-text{
    font-size:25px;
    line-height:1.8;
    font-weight:bold;
    white-space:pre-line;
    text-shadow:0 2px 8px rgba(0,0,0,.3);
}

.quote-author{
    margin-top:28px;
    font-size:14px;
    opacity:.9;
}

.quote-footer{
    margin-top:35px;
    font-size:12px;
    opacity:.8;
}

/* OUTPUT */

.output{
    display:none;
    margin-top:25px;
}

.output h3{
    margin-bottom:10px;
}

.output textarea{
    min-height:260px;
    background:#f7f7f7;
    font-family:monospace;
    font-size:13px;
}

.copy-btn{
    width:100%;
    border:0;
    background:#222;
    color:white;
    padding:13px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
}

.download-btn{
    width:100%;
    border:0;
    background:#188038;
    color:white;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#6a11cb;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:550px){

    .admin-box{
        padding:20px 16px;
    }

    .quote-text{
        font-size:20px;
    }

    .quote-brand{
        font-size:17px;
    }

}

</style>

</head>

<body>

<header>

<h1>
Tehalka <span>Quotes</span>
</h1>

<p>Admin Panel</p>

</header>


<div class="container">

<div class="admin-box">

<div class="title">

<h2>➕ Add New Shayari</h2>

<p>
बस Shayari लिखें — Quote Image अपने-आप तैयार होगी
</p>

</div>


<!-- TITLE -->

<label for="title">
Shayari Title
</label>

<input
type="text"
id="title"
placeholder="जैसे: नई शुरुआत"
>


<!-- CATEGORY -->

<label for="category">
Category
</label>

<select id="category">

<option value="Love">❤️ Love</option>

<option value="Sad">😔 Sad</option>

<option value="Life">🌿 Life</option>

<option value="Motivational">💪 Motivational</option>

<option value="Attitude">🔥 Attitude</option>

<option value="Friendship">🤝 Friendship</option>

<option value="Shayari">📝 Shayari</option>

</select>


<!-- SHAYARI -->

<label for="shayari">
अपनी Shayari लिखें
</label>

<textarea
id="shayari"
placeholder="यहाँ अपनी पूरी Shayari लिखें..."
></textarea>


<!-- AUTHOR -->

<label for="author">
Author / नाम
</label>

<input
type="text"
id="author"
placeholder="Tehalka Quotes"
>


<!-- PREPARE -->

<button
class="publish-btn"
onclick="createQuote()">

✨ Quote Image तैयार करें

</button>


<button
class="clear-btn"
onclick="clearForm()">

🗑️ Clear

</button>


<div
class="message"
id="message">
</div>


<!-- PREVIEW -->

<div
class="preview"
id="preview">

<h3>
👀 Quote Image Preview
</h3>


<div
class="quote-image"
id="quoteImage">

<div class="quote-content">

<div class="quote-brand">
TEHALKA QUOTES
</div>

<div
class="quote-category"
id="previewCategory">
</div>

<div
class="quote-text"
id="previewText">
</div>

<div
class="quote-author"
id="previewAuthor">
</div>

<div class="quote-footer">
www.tehalkaquotes.com
</div>

</div>

</div>


<button
class="download-btn"
onclick="downloadImage()">

🖼️ Quote Image Download करें

</button>

</div>


<!-- DATA -->

<div
class="output"
id="output">

<h3>
📦 Quote Data
</h3>

<textarea
id="generatedCode"
readonly>
</textarea>

<button
class="copy-btn"
onclick="copyGenerated()">

📋 Copy Data

</button>

</div>


<a
href="index.html"
class="back">

← Website पर वापस जाएँ

</a>

</div>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

let generatedImageData = "";

let generatedFileName = "";


/* =========================================
   CATEGORY BACKGROUNDS
========================================= */

const backgrounds = {

    Love:
        "linear-gradient(135deg,#ff416c,#ff4b2b)",

    Sad:
        "linear-gradient(135deg,#283048,#859398)",

    Life:
        "linear-gradient(135deg,#134e2a,#3c8d4e)",

    Motivational:
        "linear-gradient(135deg,#141e30,#243b55)",

    Attitude:
        "linear-gradient(135deg,#232526,#414345)",

    Friendship:
        "linear-gradient(135deg,#396afc,#2948ff)",

    Shayari:
        "linear-gradient(135deg,#42275a,#734b6d)"

};


/* =========================================
   CREATE QUOTE
========================================= */

function createQuote(){

    const title =
        document
        .getElementById("title")
        .value
        .trim();


    const category =
        document
        .getElementById("category")
        .value;


    const shayari =
        document
        .getElementById("shayari")
        .value
        .trim();


    const author =
        document
        .getElementById("author")
        .value
        .trim();


    const message =
        document
        .getElementById("message");


    /* VALIDATION */

    if(!title){

        message.innerText =
            "⚠️ पहले Title लिखें।";

        message.style.color =
            "#d93025";

        return;

    }


    if(!shayari){

        message.innerText =
            "⚠️ पहले Shayari लिखें।";

        message.style.color =
            "#d93025";

        return;

    }


    /* BACKGROUND */

    const quoteImage =
        document
        .getElementById("quoteImage");


    quoteImage.style.background =
        backgrounds[category];


    /* PREVIEW */

    document
    .getElementById("previewCategory")
    .innerText =
        category;


    document
    .getElementById("previewText")
    .innerText =
        shayari;


    document
    .getElementById("previewAuthor")
    .innerText =
        "— " +
        (
            author ||
            "Tehalka Quotes"
        );


    document
    .getElementById("preview")
    .style.display =
        "block";


    /* FILE NAME */

    const cleanName =
        title
        .toLowerCase()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );


    generatedFileName =
        cleanName ||
        "tehalka-quote";


    /* DATA */

    const data = {

        title:
            title,

        category:
            category,

        text:
            shayari,

        author:
            author ||
            "Tehalka Quotes",

        image:
            "images/" +
            generatedFileName +
            ".png"

    };


    document
    .getElementById("generatedCode")
    .value =
        JSON.stringify(
            data,
            null,
            4
        );


    document
    .getElementById("output")
    .style.display =
        "block";


    message.innerText =
        "✅ Quote Image तैयार है!";

    message.style.color =
        "#188038";


    document
    .getElementById("preview")
    .scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================================
   DOWNLOAD QUOTE IMAGE
========================================= */

function downloadImage(){

    const title =
        document
        .getElementById("title")
        .value
        .trim();


    const category =
        document
        .getElementById("category")
        .value;


    const text =
        document
        .getElementById("shayari")
        .value
        .trim();


    const author =
        document
        .getElementById("author")
        .value
        .trim() ||
        "Tehalka Quotes";


    const canvas =
        document.createElement("canvas");


    canvas.width = 1080;
    canvas.height = 1080;


    const ctx =
        canvas.getContext("2d");


    /* BACKGROUND */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            1080,
            1080
        );


    const colors = {

        Love:
            ["#ff416c","#ff4b2b"],

        Sad:
            ["#283048","#859398"],

        Life:
            ["#134e2a","#3c8d4e"],

        Motivational:
            ["#141e30","#243b55"],

        Attitude:
            ["#232526","#414345"],

        Friendship:
            ["#396afc","#2948ff"],

        Shayari:
            ["#42275a","#734b6d"]

    };


    const selected =
        colors[category] ||
        colors.Life;


    gradient.addColorStop(
        0,
        selected[0]
    );


    gradient.addColorStop(
        1,
        selected[1]
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        1080,
        1080
    );


    /* DECORATION */

    ctx.fillStyle =
        "rgba(255,255,255,.08)";


    ctx.beginPath();

    ctx.arc(
        150,
        150,
        130,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        930,
        900,
        180,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* BRAND */

    ctx.textAlign =
        "center";


    ctx.fillStyle =
        "white";


    ctx.font =
        "bold 40px Arial";


    ctx.fillText(
        "TEHALKA QUOTES",
        540,
        130
    );


    /* CATEGORY */

    ctx.font =
        "bold 28px Arial";


    ctx.fillStyle =
        "rgba(255,255,255,.9)";


    ctx.fillText(
        category.toUpperCase(),
        540,
        220
    );


    /* QUOTE */

    ctx.font =
        "bold 44px Arial";


    const maxWidth =
        850;


    const words =
        text.split(/\s+/);


    const lines = [];

    let line = "";


    words.forEach(function(word){

        const test =
            line
            ? line + " " + word
            : word;


        if(
            ctx.measureText(test).width
            > maxWidth
        ){

            lines.push(line);

            line =
                word;

        }else{

            line =
                test;

        }

    });


    if(line){

        lines.push(line);

    }


    let startY =
        440;


    const lineHeight =
        72;


    lines.forEach(function(item){

        ctx.fillText(
            item,
            540,
            startY
        );

        startY +=
            lineHeight;

    });


    /* AUTHOR */

    ctx.font =
        "24px Arial";


    ctx.fillStyle =
        "rgba(255,255,255,.85)";


    ctx.fillText(
        "— " + author,
        540,
        850
    );


    /* FOOTER */

    ctx.font =
        "20px Arial";


    ctx.fillText(
        "Tehalka Quotes",
        540,
        970
    );


    /* DOWNLOAD */

    const link =
        document.createElement("a");


    link.download =
        generatedFileName +
        ".png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();


    document
    .getElementById("message")
    .innerText =
        "✅ Quote Image download हो गई!";


    document
    .getElementById("message")
    .style.color =
        "#188038";

}


/* =========================================
   COPY DATA
========================================= */

function copyGenerated(){

    const data =
        document
        .getElementById("generatedCode")
        .value;


    if(
        navigator.clipboard
    ){

        navigator.clipboard
        .writeText(data)
        .then(function(){

            document
            .getElementById("message")
            .innerText =
                "📋 Quote Data copied!";

            document
            .getElementById("message")
            .style.color =
                "#188038";

        });

    }

}


/* =========================================
   CLEAR
========================================= */

function clearForm(){

    document
    .getElementById("title")
    .value = "";


    document
    .getElementById("shayari")
    .value = "";


    document
    .getElementById("author")
    .value = "";


    document
    .getElementById("preview")
    .style.display =
        "none";


    document
    .getElementById("output")
    .style.display =
        "none";


    document
    .getElementById("message")
    .innerText =
        "";


    generatedImageData = "";

    generatedFileName = "";

}

</script>

</body>
    </html>
