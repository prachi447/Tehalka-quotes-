<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Tehalka Quotes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f9;
    color:#222;
    min-height:100vh;
}

header{
    background:#17181d;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:25px;
}

header span{
    color:#ffd54a;
}

.container{
    max-width:700px;
    margin:25px auto;
    padding:0 16px 50px;
}

.admin-box{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 7px 25px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    margin-bottom:7px;
}

.title p{
    color:#777;
    font-size:14px;
}

label{
    display:block;
    font-weight:bold;
    margin:18px 0 8px;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    font-family:inherit;
}

textarea{
    min-height:160px;
    resize:vertical;
    line-height:1.7;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#6a11cb;
}

/* TOKEN */

.security-box{
    background:#fff8e1;
    border:1px solid #ffe082;
    border-radius:14px;
    padding:15px;
    margin-bottom:20px;
}

.security-box strong{
    color:#8a6200;
}

.security-box p{
    color:#725d20;
    font-size:13px;
    line-height:1.6;
    margin-top:6px;
}

/* IMAGE */

.image-box{
    border:2px dashed #d5d5d5;
    border-radius:15px;
    padding:20px;
    text-align:center;
    background:#fafafa;
}

.image-box input{
    border:0;
    padding:10px;
    background:white;
}

.image-help{
    color:#777;
    font-size:13px;
    margin-top:8px;
}

.image-preview{
    display:none;
    margin-top:15px;
}

.image-preview img{
    width:100%;
    max-height:350px;
    object-fit:cover;
    border-radius:15px;
}

.file-name{
    margin-top:8px;
    font-size:13px;
    color:#666;
    word-break:break-all;
}

/* BUTTON */

.publish-btn{
    width:100%;
    border:0;
    background:#6a11cb;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:22px;
}

.publish-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.clear-btn{
    width:100%;
    border:0;
    background:#eee;
    color:#333;
    padding:13px;
    border-radius:12px;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
}

/* PREVIEW */

.preview{
    margin-top:30px;
    display:none;
}

.preview h3{
    margin-bottom:12px;
}

.preview-card{
    position:relative;
    overflow:hidden;
    min-height:420px;
    border-radius:20px;
    color:white;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    text-align:center;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
}

.preview-card img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.preview-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.85),
        rgba(0,0,0,.1)
    );
}

.preview-content{
    position:relative;
    z-index:2;
    padding:30px 20px;
    width:100%;
}

.preview-category{
    display:inline-block;
    background:rgba(255,255,255,.2);
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:20px;
}

.preview-text{
    font-size:21px;
    line-height:1.8;
    font-weight:bold;
    white-space:pre-line;
}

.preview-author{
    margin-top:15px;
    font-size:13px;
}

/* MESSAGE */

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    font-weight:bold;
    line-height:1.6;
}

/* BACK */

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#6a11cb;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:550px){

    .admin-box{
        padding:20px 16px;
    }

    .preview-text{
        font-size:18px;
    }

}

</style>

</head>

<body>

<header>

<h1>
Tehalka <span>Quotes</span>
</h1>

<p>Admin Panel</p>

</header>


<div class="container">

<div class="admin-box">

<div class="title">

<h2>➕ Add New Shayari</h2>

<p>
Shayari + Image सीधे Website पर Publish करें
</p>

</div>


<!-- SECURITY -->

<div class="security-box">

<strong>🔐 GitHub Token</strong>

<p>
अपना GitHub token यहाँ केवल Publish करते समय डालें।
यह token इस page के code में save नहीं किया गया है।
</p>

</div>


<label for="token">
GitHub Token
</label>

<input
type="password"
id="token"
placeholder="github_pat_..."
autocomplete="off"
>


<!-- TITLE -->

<label for="title">
Shayari Title
</label>

<input
type="text"
id="title"
placeholder="जैसे: नई शुरुआत"
>


<!-- CATEGORY -->

<label for="category">
Category
</label>

<select id="category">

<option value="Love">❤️ Love</option>
<option value="Sad">😔 Sad</option>
<option value="Life">🌿 Life</option>
<option value="Motivational">💪 Motivational</option>
<option value="Attitude">🔥 Attitude</option>
<option value="Friendship">🤝 Friendship</option>
<option value="Shayari">📝 Shayari</option>

</select>


<!-- SHAYARI -->

<label for="shayari">
अपनी Shayari लिखें
</label>

<textarea
id="shayari"
placeholder="यहाँ अपनी पूरी Shayari लिखें..."
></textarea>


<!-- AUTHOR -->

<label for="author">
Author / नाम
</label>

<input
type="text"
id="author"
placeholder="Tehalka Quotes"
>


<!-- IMAGE -->

<label>
🖼️ Quote Image
</label>

<div class="image-box">

<input
type="file"
id="quoteImage"
accept="image/*"
onchange="previewImage(event)"
>

<div class="image-help">
Quote के अनुसार image चुनें
</div>

<div
class="image-preview"
id="imagePreview">

<img
id="selectedImage"
alt="Selected image"
>

<div
class="file-name"
id="fileName">
</div>

</div>

</div>


<!-- PUBLISH -->

<button
class="publish-btn"
id="publishButton"
onclick="publishQuote()">

🚀 Publish Shayari

</button>


<button
class="clear-btn"
onclick="clearForm()">

🗑️ Clear

</button>


<div
class="message"
id="message">
</div>


<!-- PREVIEW -->

<div
class="preview"
id="preview">

<h3>👀 Preview</h3>

<div class="preview-card">

<img
id="previewImage"
alt="Quote image"
>

<div class="preview-overlay"></div>

<div class="preview-content">

<div
class="preview-category"
id="previewCategory">
</div>

<div
class="preview-text"
id="previewText">
</div>

<div
class="preview-author"
id="previewAuthor">
</div>

</div>

</div>

</div>


<a
href="index.html"
class="back">

← वापस Website पर जाएँ

</a>

</div>

</div>


<script>

/* ==========================================
   GITHUB SETTINGS
========================================== */

const GITHUB_OWNER = "prachi447";

const GITHUB_REPO = "Tehalka-quotes-";

const GITHUB_BRANCH = "main";


/* ==========================================
   VARIABLES
========================================== */

let selectedImageData = "";

let selectedFileName = "";


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,color){

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.style.color = color;

}


/* ==========================================
   IMAGE PREVIEW
========================================== */

function previewImage(event){

    const file =
        event.target.files[0];

    if(!file){

        return;

    }

    selectedFileName =
        file.name;

    const reader =
        new FileReader();

    reader.onload =
    function(e){

        selectedImageData =
            e.target.result;

        document
        .getElementById("selectedImage")
        .src =
            selectedImageData;

        document
        .getElementById("previewImage")
        .src =
            selectedImageData;

        document
        .getElementById("imagePreview")
        .style.display =
            "block";

        document
        .getElementById("fileName")
        .innerText =
            "Selected: " +
            selectedFileName;

    };

    reader.readAsDataURL(file);

}


/* ==========================================
   BASE64
========================================== */

function getBase64Data(dataURL){

    return dataURL.split(",")[1];

}


/* ==========================================
   SAFE FILE NAME
========================================== */

function makeFileName(title){

    let name =
        title
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

    if(!name){

        name = "quote";

    }

    return name;

}


/* ==========================================
   GITHUB API
========================================== */

async function githubRequest(
    url,
    token,
    options={}
){

    const response =
        await fetch(
            url,
            {

                ...options,

                headers:{
                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + token,

                    "X-GitHub-Api-Version":
                        "2022-11-28",

                    ...(options.headers || {})
                }

            }
        );


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data.message ||
            "GitHub request failed"
        );

    }


    return data;

}


/* ==========================================
   GET FILE
========================================== */

async function getGitHubFile(
    path,
    token
){

    const url =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`;

    return await githubRequest(
        url,
        token
    );

}


/* ==========================================
   UPLOAD IMAGE
========================================== */

async function uploadImage(
    token,
    imagePath,
    base64
){

    const url =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${imagePath}`;

    const body = {

        message:
            "Add quote image",

        content:
            base64,

        branch:
            GITHUB_BRANCH

    };


    return await githubRequest(
        url,
        token,
        {

            method:"PUT",

            body:
                JSON.stringify(body)

        }
    );

}


/* ==========================================
   UPDATE QUOTES DATA
========================================== */

async function updateQuotesData(
    token,
    newQuote
){

    const file =
        await getGitHubFile(
            "quotes-data.js",
            token
        );


    const decoded =
        decodeURIComponent(
            escape(
                atob(
                    file.content.replace(/\n/g,"")
                )
            )
        );


    const match =
        decoded.match(
            /const\s+quotesData\s*=\s*(\[[\s\S]*\])\s*;/
        );


    if(!match){

        throw new Error(
            "quotesData array नहीं मिली।"
        );

    }


    let data;

    try{

        data =
            JSON.parse(
                match[1]
            );

    }catch(error){

        throw new Error(
            "quotes-data.js का format सही नहीं है।"
        );

    }


    if(!Array.isArray(data)){

        throw new Error(
            "quotesData array नहीं है।"
        );

    }


    const ids =
        data
        .map(
            item =>
                Number(item.id) || 0
        );


    const newId =
        Math.max(
            ...(ids.length ? ids : [0])
        ) + 1;


    newQuote.id =
        newId;


    data.push(
        newQuote
    );


    const newContent =
        "const quotesData = " +
        JSON.stringify(
            data,
            null,
            4
        ) +
        ";\n";


    const encoded =
        btoa(
            unescape(
                encodeURIComponent(
                    newContent
                )
            )
        );


    const url =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/quotes-data.js`;


    await githubRequest(
        url,
        token,
        {

            method:"PUT",

            body:
                JSON.stringify({

                    message:
                        "Add new Shayari",

                    content:
                        encoded,

                    sha:
                        file.sha,

                    branch:
                        GITHUB_BRANCH

                })

        }
    );


    return newId;

}


/* ==========================================
   PUBLISH
========================================== */

async function publishQuote(){

    const button =
        document.getElementById(
            "publishButton"
        );


    const token =
        document
        .getElementById("token")
        .value
        .trim();


    const title =
        document
        .getElementById("title")
        .value
        .trim();


    const category =
        document
        .getElementById("category")
        .value;


    const text =
        document
        .getElementById("shayari")
        .value
        .trim();


    const author =
        document
        .getElementById("author")
        .value
        .trim()
        ||
        "Tehalka Quotes";


    /* VALIDATION */

    if(!token){

        showMessage(
            "⚠️ GitHub Token डालें।",
            "#d93025"
        );

        return;

    }


    if(!title){

        showMessage(
            "⚠️ Title लिखें।",
            "#d93025"
        );

        return;

    }


    if(!text){

        showMessage(
            "⚠️ Shayari लिखें।",
            "#d93025"
        );

        return;

    }


    if(!selectedImageData){

        showMessage(
            "⚠️ Quote की image चुनें।",
            "#d93025"
        );

        return;

    }


    try{

        button.disabled = true;

        button.innerText =
            "⏳ Publishing...";


        /* PREVIEW */

        document
        .getElementById("previewImage")
        .src =
            selectedImageData;

        document
        .getElementById("previewCategory")
        .innerText =
            category;

        document
        .getElementById("previewText")
        .innerText =
            text;

        document
        .getElementById("previewAuthor")
        .innerText =
            "— " + author;

        document
        .getElementById("preview")
        .style.display =
            "block";


        /* FILE NAME */

        const extension =
            selectedFileName
            .split(".")
            .pop()
            .toLowerCase();


        const safeName =
            makeFileName(title);


        const imagePath =
            "images/" +
            safeName +
            "." +
            extension;


        showMessage(
            "⏳ Image GitHub पर upload हो रही है...",
            "#6a11cb"
        );


        /* IMAGE */

        await uploadImage(
            token,
            imagePath,
            getBase64Data(
                selectedImageData
            )
        );


        showMessage(
            "⏳ अब quote data update हो रहा है...",
            "#6a11cb"
        );


        /* QUOTE */

        const newQuote = {

            title:
                title,

            category:
                category,

            text:
                text,

            author:
                author,

            image:
                imagePath

        };


        const newId =
            await updateQuotesData(
                token,
                newQuote
            );


        showMessage(
            "🎉 Successfully Published! Quote ID: " +
            newId,
            "#188038"
        );


        button.innerText =
            "✅ Published";


        /*
         * Security:
         * token field को खाली कर दें।
         */

        document
        .getElementById("token")
        .value = "";


    }catch(error){

        console.error(error);

        showMessage(
            "❌ Error: " +
            error.message,
            "#d93025"
        );

        button.innerText =
            "🚀 Publish Shayari";

    }finally{

        button.disabled = false;

    }

}


/* ==========================================
   CLEAR
========================================== */

function clearForm(){

    document
    .getElementById("token")
    .value = "";

    document
    .getElementById("title")
    .value = "";

    document
    .getElementById("shayari")
    .value = "";

    document
    .getElementById("author")
    .value = "";

    document
    .getElementById("quoteImage")
    .value = "";

    document
    .getElementById("imagePreview")
    .style.display =
        "none";

    document
    .getElementById("preview")
    .style.display =
        "none";

    document
    .getElementById("message")
    .innerText =
        "";

    document
    .getElementById("publishButton")
    .innerText =
        "🚀 Publish Shayari";

    selectedImageData = "";

    selectedFileName = "";

}

</script>

</body>

</html>
