<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Tehalka Quotes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f9;
    color:#222;
    min-height:100vh;
}

header{
    background:#17181d;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:25px;
}

header span{
    color:#ffd54a;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 18px 50px;
}

.admin-box{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 7px 25px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    margin-bottom:7px;
}

.title p{
    color:#777;
    font-size:14px;
}

label{
    display:block;
    font-weight:bold;
    margin:18px 0 8px;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    font-family:inherit;
}

textarea{
    min-height:170px;
    resize:vertical;
    line-height:1.7;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#6a11cb;
}

.publish-btn{
    width:100%;
    border:0;
    background:#6a11cb;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:22px;
}

.publish-btn:hover{
    background:#5310a1;
}

.clear-btn{
    width:100%;
    border:0;
    background:#eee;
    color:#333;
    padding:13px;
    border-radius:12px;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
}

.preview{
    margin-top:30px;
    display:none;
}

.preview h3{
    margin-bottom:12px;
}

.preview-card{
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    color:white;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
}

.preview-category{
    display:inline-block;
    background:rgba(255,255,255,.2);
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:20px;
}

.preview-text{
    font-size:20px;
    line-height:1.8;
    font-weight:bold;
}

.output{
    margin-top:25px;
    display:none;
}

.output h3{
    margin-bottom:10px;
}

.output textarea{
    min-height:230px;
    background:#f7f7f7;
    font-family:monospace;
    font-size:13px;
}

.copy-btn{
    width:100%;
    border:0;
    background:#222;
    color:white;
    padding:13px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#6a11cb;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:550px){

    .container{
        margin-top:20px;
    }

    .admin-box{
        padding:20px 16px;
    }

}

</style>

</head>

<body>

<header>

<h1>
Tehalka <span>Quotes</span>
</h1>

<p>
Admin Panel
</p>

</header>


<div class="container">

<div class="admin-box">

<div class="title">

<h2>➕ Add New Shayari</h2>

<p>
अपनी नई Shayari तैयार करें
</p>

</div>


<!-- TITLE -->

<label for="title">
Shayari Title
</label>

<input
type="text"
id="title"
placeholder="जैसे: दिल की बात"
>


<!-- CATEGORY -->

<label for="category">
Category
</label>

<select id="category">

<option value="Love">
❤️ Love
</option>

<option value="Sad">
😔 Sad
</option>

<option value="Life">
🌿 Life
</option>

<option value="Motivational">
💪 Motivational
</option>

<option value="Attitude">
🔥 Attitude
</option>

<option value="Friendship">
🤝 Friendship
</option>

<option value="Shayari">
📝 Shayari
</option>

</select>


<!-- SHAYARI -->

<label for="shayari">
अपनी Shayari लिखें
</label>

<textarea
id="shayari"
placeholder="यहाँ अपनी पूरी Shayari लिखें...

उदाहरण:

तेरी यादों का सिलसिला आज भी है,
दिल में तेरा ही बसेरा आज भी है..."
></textarea>


<!-- AUTHOR -->

<label for="author">
Author / नाम (Optional)
</label>

<input
type="text"
id="author"
placeholder="जैसे: Tehalka Quotes"
>


<!-- PUBLISH -->

<button
class="publish-btn"
onclick="createShayari()"
>
🚀 Publish Shayari
</button>


<button
class="clear-btn"
onclick="clearForm()"
>
🗑️ Clear
</button>


<div
class="message"
id="message">
</div>


<!-- PREVIEW -->

<div
class="preview"
id="preview">

<h3>
👀 Preview
</h3>

<div class="preview-card">

<div
class="preview-category"
id="previewCategory">
</div>

<div
class="preview-text"
id="previewText">
</div>

</div>

</div>


<!-- GENERATED DATA -->

<div
class="output"
id="output">

<h3>
📦 Website Data
</h3>

<textarea
id="generatedCode"
readonly>
</textarea>

<button
class="copy-btn"
onclick="copyGenerated()"
>
📋 Copy Data
</button>

</div>


<a
href="index.html"
class="back"
>
← वापस Website पर जाएँ
</a>

</div>

</div>


<script>

/* CATEGORY ICON */

function getIcon(category){

    const icons = {

        Love:"❤️",

        Sad:"😔",

        Life:"🌿",

        Motivational:"💪",

        Attitude:"🔥",

        Friendship:"🤝",

        Shayari:"📝"

    };

    return icons[category] || "📝";

}


/* CREATE SHAYARI */

function createShayari(){

    const title =
        document
        .getElementById("title")
        .value
        .trim();

    const category =
        document
        .getElementById("category")
        .value;

    const shayari =
        document
        .getElementById("shayari")
        .value
        .trim();

    const author =
        document
        .getElementById("author")
        .value
        .trim();


    const message =
        document
        .getElementById("message");


    /* VALIDATION */

    if(!shayari){

        message.innerText =
            "⚠️ पहले Shayari लिखें।";

        message.style.color =
            "#d93025";

        return;

    }


    /* PREVIEW */

    document
    .getElementById("previewCategory")
    .innerText =
        getIcon(category) +
        " " +
        category;


    document
    .getElementById("previewText")
    .innerText =
        shayari;


    document
    .getElementById("preview")
    .style.display =
        "block";


    /* DATA OBJECT */

    const data = {

        title:title || "Untitled Shayari",

        category:category,

        text:shayari,

        author:
            author ||
            "Tehalka Quotes",

        date:
            new Date()
            .toISOString()

    };


    /* JSON */

    const json =
        JSON.stringify(
            data,
            null,
            4
        );


    document
    .getElementById("generatedCode")
    .value =
        json;


    document
    .getElementById("output")
    .style.display =
        "block";


    message.innerText =
        "✅ Shayari तैयार हो गई!";

    message.style.color =
        "#188038";


    document
    .getElementById("output")
    .scrollIntoView({
        behavior:"smooth"
    });

}


/* COPY GENERATED DATA */

function copyGenerated(){

    const output =
        document
        .getElementById("generatedCode")
        .value;


    if(navigator.clipboard){

        navigator.clipboard
        .writeText(output)
        .then(function(){

            const message =
                document
                .getElementById("message");

            message.innerText =
                "📋 Data copied!";

            message.style.color =
                "#188038";

        });

    }

}


/* CLEAR */

function clearForm(){

    document
    .getElementById("title")
    .value = "";

    document
    .getElementById("shayari")
    .value = "";

    document
    .getElementById("author")
    .value = "";

    document
    .getElementById("preview")
    .style.display =
        "none";

    document
    .getElementById("output")
    .style.display =
        "none";

    document
    .getElementById("message")
    .innerText =
        "";

}

</script>

</body>
</html>
