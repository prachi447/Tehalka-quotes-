name: Add Shayari

on:
  workflow_dispatch:
    inputs:

      title:
        description: "Shayari Title"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: choice
        options:
          - Love
          - Sad
          - Life
          - Motivational
          - Attitude
          - Friendship
          - Shayari

      text:
        description: "Shayari Text"
        required: true
        type: string

      author:
        description: "Author"
        required: false
        default: "Tehalka Quotes"
        type: string


permissions:
  contents: write


jobs:

  add-shayari:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Add Shayari and automatic image

        env:
          TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          TEXT: ${{ inputs.text }}
          AUTHOR: ${{ inputs.author }}

        run: |

          python - <<'PY'

          import os
          import re
          import html
          import sys
          import subprocess
          import json


          DATA_FILE = "quotes-data.js"
          IMAGE_FOLDER = "images"


          print("======================================")
          print("       TEHALKA QUOTES")
          print("       ADD NEW SHAYARI")
          print("======================================")


          # ======================================
          # CHECK DATA FILE
          # ======================================

          if not os.path.exists(DATA_FILE):

              print("❌ quotes-data.js नहीं मिली।")
              sys.exit(1)


          # ======================================
          # READ CURRENT JAVASCRIPT DATA
          # ======================================

          with open(
              DATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              content = f.read()


          # ======================================
          # EXTRACT ARRAY
          # Supports normal JavaScript syntax
          # ======================================

          match = re.search(
              r'(?:window\.)?quotesData\s*=\s*(\[.*\])\s*;?\s*$',
              content,
              re.DOTALL
          )


          if not match:

              print(
                  "❌ quotesData array नहीं मिली।"
              )

              sys.exit(1)


          array_text = match.group(1)


          # ======================================
          # CONVERT JAVASCRIPT ARRAY TO JSON
          # ======================================

          try:

              data = json.loads(
                  array_text
              )

          except Exception:

              print(
                  "⚠️ quotes-data.js strict JSON नहीं है।"
              )

              print(
                  "JavaScript syntax को पढ़ने की कोशिश..."
              )

              # Temporary JS file
              temp_file = "/tmp/read_quotes.js"

              js_code = f"""
const fs = require('fs');

const content = fs.readFileSync(
    '{DATA_FILE}',
    'utf8'
);

globalThis.window = {{}};

eval(content);

if (
    typeof window.quotesData !== 'undefined'
) {{

    console.log(
        JSON.stringify(
            window.quotesData
        )
    );

}} else if (
    typeof quotesData !== 'undefined'
) {{

    console.log(
        JSON.stringify(
            quotesData
        )
    );

}} else {{

    process.exit(2);

}}
"""

              with open(
                  temp_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(js_code)


              result = subprocess.run(
                  [
                      "node",
                      temp_file
                  ],
                  capture_output=True,
                  text=True
              )


              if result.returncode != 0:

                  print(
                      "❌ quotes-data.js को JavaScript के रूप में भी पढ़ा नहीं जा सका।"
                  )

                  print(
                      result.stderr
                  )

                  sys.exit(1)


              try:

                  data = json.loads(
                      result.stdout.strip()
                  )

              except Exception as error:

                  print(
                      "❌ Data convert नहीं हो पाया।"
                  )

                  print(
                      error
                  )

                  sys.exit(1)


          # ======================================
          # CHECK DATA
          # ======================================

          if not isinstance(
              data,
              list
          ):

              print(
                  "❌ quotesData list नहीं है।"
              )

              sys.exit(1)


          # ======================================
          # INPUTS
          # ======================================

          title = os.environ.get(
              "TITLE",
              ""
          ).strip()


          category = os.environ.get(
              "CATEGORY",
              "Shayari"
          ).strip()


          text = os.environ.get(
              "TEXT",
              ""
          ).strip()


          author = os.environ.get(
              "AUTHOR",
              "Tehalka Quotes"
          ).strip()


          if not title:

              print("❌ Title खाली है.")
              sys.exit(1)


          if not text:

              print("❌ Shayari Text खाली है.")
              sys.exit(1)


          if not author:

              author = "Tehalka Quotes"


          # ======================================
          # NEW ID
          # ======================================

          ids = []


          for item in data:

              if isinstance(
                  item,
                  dict
              ):

                  try:

                      ids.append(
                          int(
                              item.get(
                                  "id",
                                  0
                              )
                          )
                      )

                  except:

                      pass


          new_id = max(
              ids or [0]
          ) + 1


          # ======================================
          # IMAGE
          # ======================================

          os.makedirs(
              IMAGE_FOLDER,
              exist_ok=True
          )


          image_filename = (
              "quote-" +
              str(new_id) +
              ".svg"
          )


          image_path = (
              IMAGE_FOLDER +
              "/" +
              image_filename
          )


          # ======================================
          # ESCAPE TEXT
          # ======================================

          safe_category = html.escape(
              category
          )


          safe_author = html.escape(
              author
          )


          safe_title = html.escape(
              title
          )


          # ======================================
          # WRAP SHAYARI
          # ======================================

          words = text.split()

          lines = []

          line = ""


          for word in words:

              test = (
                  word
                  if not line
                  else line + " " + word
              )


              if len(test) > 28:

                  if line:

                      lines.append(
                          line
                      )

                  line = word

              else:

                  line = test


          if line:

              lines.append(
                  line
              )


          if not lines:

              lines = [text]


          # ======================================
          # SVG TEXT
          # ======================================

          text_elements = []


          start_y = (
              500 -
              ((len(lines) - 1) * 32)
          )


          for i, line_text in enumerate(lines):

              safe_line = html.escape(
                  line_text
              )


              y = (
                  start_y +
                  i * 64
              )


              text_elements.append(
                  f'''
                  <text
                      x="540"
                      y="{y}"
                      text-anchor="middle"
                      class="quote"
                  >{safe_line}</text>
                  '''
              )


          quote_svg = "\n".join(
              text_elements
          )


          # ======================================
          # CREATE AUTOMATIC IMAGE
          # ======================================

          svg = f'''<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
width="1080"
height="1080"
viewBox="0 0 1080 1080">

<defs>

<linearGradient
id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop
offset="0%"
stop-color="#17181d"/>

<stop
offset="50%"
stop-color="#6a11cb"/>

<stop
offset="100%"
stop-color="#2575fc"/>

</linearGradient>

</defs>


<rect
width="1080"
height="1080"
fill="url(#bg)"/>


<rect
width="1080"
height="1080"
fill="rgba(0,0,0,0.35)"/>


<text
x="540"
y="80"
text-anchor="middle"
class="brand">

✨ Tehalka Quotes

</text>


<text
x="540"
y="135"
text-anchor="middle"
class="category">

{safe_category}

</text>


{quote_svg}


<text
x="540"
y="930"
text-anchor="middle"
class="author">

— {safe_author}

</text>


<text
x="540"
y="985"
text-anchor="middle"
class="title">

{safe_title}

</text>


<style>

.brand {{
font-family: Arial, sans-serif;
font-size: 32px;
font-weight: bold;
fill: #ffd54a;
}}

.category {{
font-family: Arial, sans-serif;
font-size: 28px;
font-weight: bold;
fill: white;
}}

.quote {{
font-family: Arial, sans-serif;
font-size: 42px;
font-weight: bold;
fill: white;
}}

.author {{
font-family: Arial, sans-serif;
font-size: 25px;
fill: #eeeeee;
}}

.title {{
font-family: Arial, sans-serif;
font-size: 20px;
fill: #dddddd;
}}

</style>

</svg>
'''


          with open(
              image_path,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(svg)


          print(
              "🖼️ Automatic image created:",
              image_path
          )


          # ======================================
          # ADD NEW QUOTE
          # ======================================

          new_quote = {

              "id": new_id,

              "title": title,

              "category": category,

              "text": text,

              "author": author,

              "image": image_path

          }


          data.append(
              new_quote
          )


          # ======================================
          # SAVE DATA
          # ======================================

          new_content = (
              "window.quotesData = "
              +
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=4
              )
              +
              ";\n"
          )


          with open(
              DATA_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  new_content
              )


          print("")
          print("======================================")
          print("✅ SHAYARI ADDED SUCCESSFULLY")
          print("======================================")
          print("ID       :", new_id)
          print("Title    :", title)
          print("Category :", category)
          print("Author   :", author)
          print("Image    :", image_path)
          print("======================================")


          PY


      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit changes

        run: |

          git config user.name "Tehalka Quotes"

          git config user.email "actions@github.com"


          git add quotes-data.js

          git add images/


          if git diff --cached --quiet; then

            echo "⚠️ कोई बदलाव नहीं मिला."

            exit 0

          fi


          git commit \
            -m "Add new Shayari with automatic image"


          git push


      # ==========================================
      # COMPLETE
      # ==========================================

      - name: Finished

        run: |

          echo "======================================"

          echo "🎉 TEHALKA QUOTES UPDATE COMPLETE"

          echo "✅ Shayari added"

          echo "✅ Automatic image created"

          echo "✅ quotes-data.js updated"

          echo "✅ Image saved"

          echo "======================================"
