name: Add Shayari

on:
  workflow_dispatch:
    inputs:

      title:
        description: "Shayari Title"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: choice
        options:
          - Love
          - Sad
          - Life
          - Motivational
          - Attitude
          - Friendship
          - Shayari

      text:
        description: "Shayari Text"
        required: true
        type: string

      author:
        description: "Author"
        required: false
        default: "Tehalka Quotes"
        type: string


permissions:
  contents: write


jobs:

  add-shayari:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # ADD SHAYARI + AUTO IMAGE
      # ==========================================

      - name: Create Shayari and automatic image

        env:

          TITLE: ${{ inputs.title }}

          CATEGORY: ${{ inputs.category }}

          TEXT: ${{ inputs.text }}

          AUTHOR: ${{ inputs.author }}

        run: |

          python - <<'PY'

          import os
          import json
          import re
          import html
          import sys


          DATA_FILE = "quotes-data.js"

          IMAGE_FOLDER = "images"


          print("======================================")
          print("       TEHALKA QUOTES")
          print("       ADD NEW SHAYARI")
          print("======================================")


          # ======================================
          # CHECK DATA FILE
          # ======================================

          if not os.path.exists(DATA_FILE):

              print("❌ quotes-data.js नहीं मिली।")

              sys.exit(1)


          # ======================================
          # READ DATA FILE
          # ======================================

          with open(
              DATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              content = f.read()


          # ======================================
          # FIND QUOTES ARRAY
          #
          # Supports:
          #
          # window.quotesData = [...]
          #
          # OR
          #
          # const quotesData = [...]
          # ======================================

          match = re.search(
              r'(?:window\.)?quotesData\s*=\s*(\[.*?\])\s*;',
              content,
              re.DOTALL
          )


          if not match:

              print(
                  "❌ quotesData array नहीं मिली।"
              )

              sys.exit(1)


          array_text = match.group(1)


          # ======================================
          # READ JSON
          # ======================================

          try:

              data = json.loads(
                  array_text
              )

          except Exception as error:

              print(
                  "❌ quotes-data.js पढ़ने में समस्या।"
              )

              print(
                  "Error:",
                  error
              )

              sys.exit(1)


          if not isinstance(data, list):

              print(
                  "❌ quotesData list नहीं है।"
              )

              sys.exit(1)


          # ======================================
          # INPUTS
          # ======================================

          title = os.environ.get(
              "TITLE",
              ""
          ).strip()


          category = os.environ.get(
              "CATEGORY",
              "Shayari"
          ).strip()


          text = os.environ.get(
              "TEXT",
              ""
          ).strip()


          author = os.environ.get(
              "AUTHOR",
              "Tehalka Quotes"
          ).strip()


          # ======================================
          # VALIDATION
          # ======================================

          if not title:

              print("❌ Title खाली है।")

              sys.exit(1)


          if not text:

              print("❌ Shayari Text खाली है।")

              sys.exit(1)


          if not author:

              author = "Tehalka Quotes"


          # ======================================
          # NEW ID
          # ======================================

          ids = []

          for item in data:

              if isinstance(item, dict):

                  try:

                      ids.append(
                          int(
                              item.get(
                                  "id",
                                  0
                              )
                          )
                      )

                  except:

                      pass


          new_id = max(
              ids or [0]
          ) + 1


          # ======================================
          # IMAGE FILENAME
          # ======================================

          image_filename = (
              "quote-" +
              str(new_id) +
              ".svg"
          )


          image_path = (
              IMAGE_FOLDER +
              "/" +
              image_filename
          )


          # ======================================
          # CREATE IMAGES FOLDER
          # ======================================

          os.makedirs(
              IMAGE_FOLDER,
              exist_ok=True
          )


          # ======================================
          # SVG TEXT WRAPPING
          # ======================================

          def wrap_text(text, max_chars=30):

              words = text.split()

              lines = []

              current = ""


              for word in words:

                  test = (
                      word
                      if not current
                      else current + " " + word
                  )


                  if len(test) > max_chars:

                      if current:

                          lines.append(
                              current
                          )

                      current = word

                  else:

                      current = test


              if current:

                  lines.append(
                      current
                  )


              return lines


          # ======================================
          # PREPARE TEXT
          # ======================================

          safe_title = html.escape(
              title
          )


          safe_author = html.escape(
              author
          )


          safe_category = html.escape(
              category
          )


          lines = []


          for paragraph in text.splitlines():

              paragraph = paragraph.strip()

              if not paragraph:

                  continue


              lines.extend(
                  wrap_text(
                      paragraph,
                      28
                  )
              )


          if not lines:

              lines = [
                  text
              ]


          # ======================================
          # SVG QUOTE TEXT
          # ======================================

          text_elements = []


          start_y = (
              450 -
              ((len(lines) - 1) * 32)
          )


          for index, line in enumerate(lines):

              safe_line = html.escape(
                  line
              )


              y = (
                  start_y +
                  index * 64
              )


              text_elements.append(
                  f'''
                  <text
                      x="540"
                      y="{y}"
                      text-anchor="middle"
                      class="quote"
                  >{safe_line}</text>
                  '''
              )


          quote_text_svg = "\n".join(
              text_elements
          )


          # ======================================
          # CREATE AUTOMATIC SVG IMAGE
          # ======================================

          svg = f'''<?xml version="1.0" encoding="UTF-8"?>

          <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1080"
              height="1080"
              viewBox="0 0 1080 1080"
          >

              <defs>

                  <linearGradient
                      id="background"
                      x1="0%"
                      y1="0%"
                      x2="100%"
                      y2="100%"
                  >

                      <stop
                          offset="0%"
                          stop-color="#17181d"
                      />

                      <stop
                          offset="50%"
                          stop-color="#6a11cb"
                      />

                      <stop
                          offset="100%"
                          stop-color="#2575fc"
                      />

                  </linearGradient>


                  <linearGradient
                      id="overlay"
                      x1="0%"
                      y1="0%"
                      x2="0%"
                      y2="100%"
                  >

                      <stop
                          offset="0%"
                          stop-color="rgba(0,0,0,0.10)"
                      />

                      <stop
                          offset="100%"
                          stop-color="rgba(0,0,0,0.70)"
                      />

                  </linearGradient>


                  <style>

                      .brand {{
                          font-family:
                          'Noto Sans Devanagari',
                          'Noto Sans',
                          Arial,
                          sans-serif;

                          font-size:30px;

                          font-weight:bold;

                          fill:#ffd54a;
                      }}


                      .category {{
                          font-family:
                          'Noto Sans Devanagari',
                          'Noto Sans',
                          Arial,
                          sans-serif;

                          font-size:28px;

                          font-weight:bold;

                          fill:white;
                      }}


                      .quote {{
                          font-family:
                          'Noto Sans Devanagari',
                          'Noto Sans',
                          Arial,
                          sans-serif;

                          font-size:42px;

                          font-weight:bold;

                          fill:white;
                      }}


                      .author {{
                          font-family:
                          'Noto Sans Devanagari',
                          'Noto Sans',
                          Arial,
                          sans-serif;

                          font-size:25px;

                          fill:#eeeeee;
                      }}


                      .title {{
                          font-family:
                          'Noto Sans Devanagari',
                          'Noto Sans',
                          Arial,
                          sans-serif;

                          font-size:20px;

                          fill:#dddddd;
                      }}

                  </style>

              </defs>


              <rect
                  width="1080"
                  height="1080"
                  fill="url(#background)"
              />


              <rect
                  width="1080"
                  height="1080"
                  fill="url(#overlay)"
              />


              <text
                  x="540"
                  y="80"
                  text-anchor="middle"
                  class="brand"
              >
                  ✨ Tehalka Quotes
              </text>


              <text
                  x="540"
                  y="135"
                  text-anchor="middle"
                  class="category"
              >
                  {safe_category}
              </text>


              {quote_text_svg}


              <text
                  x="540"
                  y="930"
                  text-anchor="middle"
                  class="author"
              >
                  — {safe_author}
              </text>


              <text
                  x="540"
                  y="985"
                  text-anchor="middle"
                  class="title"
              >
                  {safe_title}
              </text>

          </svg>
          '''


          # ======================================
          # SAVE IMAGE
          # ======================================

          with open(
              image_path,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(svg)


          print(
              "🖼️ Automatic image created:",
              image_path
          )


          # ======================================
          # CREATE NEW QUOTE
          # ======================================

          new_quote = {

              "id":
                  new_id,

              "title":
                  title,

              "category":
                  category,

              "text":
                  text,

              "author":
                  author,

              "image":
                  image_path

          }


          # ======================================
          # ADD QUOTE
          # ======================================

          data.append(
              new_quote
          )


          # ======================================
          # SAVE quotes-data.js
          # ======================================

          new_content = (
              "window.quotesData = "
              +
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=4
              )
              +
              ";\n"
          )


          with open(
              DATA_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  new_content
              )


          # ======================================
          # SUCCESS
          # ======================================

          print("")
          print("======================================")
          print("✅ SHAYARI ADDED")
          print("======================================")
          print("ID       :", new_id)
          print("Title    :", title)
          print("Category :", category)
          print("Author   :", author)
          print("Image    :", image_path)
          print("======================================")


          PY


      # ==========================================
      # CHECK CHANGES
      # ==========================================

      - name: Check changes

        run: |

          echo "======================================"

          echo "Modified files:"

          git status

          echo "======================================"

          echo "quotes-data.js changes:"

          git diff -- quotes-data.js

          echo "======================================"


      # ==========================================
      # COMMIT & PUSH
      # ==========================================

      - name: Commit and push

        run: |

          git config user.name "Tehalka Quotes"

          git config user.email "actions@github.com"


          git add quotes-data.js

          git add images/


          if git diff --cached --quiet; then

            echo "⚠️ कोई नया बदलाव नहीं मिला।"

            exit 0

          fi


          git commit \
            -m "Add new Shayari with automatic image"


          git push


      # ==========================================
      # FINISHED
      # ==========================================

      - name: Finished

        run: |

          echo ""

          echo "======================================"

          echo "🎉 TEHALKA QUOTES UPDATE COMPLETE"

          echo "======================================"

          echo "✅ Shayari added"

          echo "✅ Automatic image created"

          echo "✅ quotes-data.js updated"

          echo "✅ Image saved"

          echo "✅ Changes pushed to GitHub"

          echo "======================================"
