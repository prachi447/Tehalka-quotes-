name: Add Shayari

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Shayari Title"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: choice
        options:
          - Love
          - Sad
          - Life
          - Motivational
          - Attitude
          - Friendship
          - Shayari

      text:
        description: "Shayari Text"
        required: true
        type: string

      author:
        description: "Author"
        required: false
        default: "Tehalka Quotes"
        type: string

permissions:
  contents: write

jobs:

  add-shayari:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Shayari
        env:
          TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          TEXT: ${{ inputs.text }}
          AUTHOR: ${{ inputs.author }}
        run: |

          node <<'NODE'

          const fs = require("fs");
          const vm = require("vm");

          const file = "quotes-data.js";

          const title = process.env.TITLE;
          const category = process.env.CATEGORY;
          const text = process.env.TEXT;
          const author = process.env.AUTHOR || "Tehalka Quotes";

          console.log("Reading quotes-data.js...");

          const content = fs.readFileSync(file, "utf8");

          const sandbox = {};

          vm.createContext(sandbox);

          try {
            vm.runInContext(content, sandbox);
          } catch (error) {
            console.error("quotes-data.js पढ़ने में error आया:");
            console.error(error);
            process.exit(1);
          }

          let data = sandbox.quotesData;

          if (!Array.isArray(data)) {
            console.error("Error: quotesData एक array नहीं है।");
            process.exit(1);
          }

          const newId =
            Math.max(
              0,
              ...data.map(item => Number(item.id) || 0)
            ) + 1;

          const newShayari = {
            id: newId,
            title: title,
            category: category,
            text: text,
            author: author
          };

          data.push(newShayari);

          const newContent =
            "const quotesData = " +
            JSON.stringify(data, null, 2) +
            ";\n";

          fs.writeFileSync(
            file,
            newContent,
            "utf8"
          );

          console.log("================================");
          console.log("✅ Shayari successfully added!");
          console.log("Title:", title);
          console.log("Category:", category);
          console.log("Author:", author);
          console.log("ID:", newId);
          console.log("================================");

          NODE

      - name: Save Shayari
        run: |

          git config user.name "Tehalka Quotes"
          git config user.email "actions@github.com"

          git add quotes-data.js

          git diff --cached --quiet || git commit -m "Add new Shayari"

          git push
