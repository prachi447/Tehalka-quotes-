name: Add Shayari

on:
  workflow_dispatch:
    inputs:

      title:
        description: "Shayari Title"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: choice
        options:
          - Love
          - Sad
          - Life
          - Motivational
          - Attitude
          - Friendship
          - Shayari

      text:
        description: "Shayari Text"
        required: true
        type: string

      author:
        description: "Author"
        required: false
        default: "Tehalka Quotes"
        type: string

      image_path:
        description: "Image path inside images folder"
        required: true
        type: string


permissions:
  contents: write


jobs:

  add-shayari:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # ADD SHAYARI
      # ==========================================

      - name: Add Shayari to quotes-data.js

        env:
          TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          TEXT: ${{ inputs.text }}
          AUTHOR: ${{ inputs.author }}
          IMAGE_PATH: ${{ inputs.image_path }}

        run: |

          python - <<'PY'

          import os
          import json
          import re
          import sys


          FILE = "quotes-data.js"


          print("====================================")
          print("      TEHALKA QUOTES")
          print("      ADD NEW SHAYARI")
          print("====================================")


          # --------------------------------------
          # CHECK FILE
          # --------------------------------------

          if not os.path.exists(FILE):

              print("❌ quotes-data.js नहीं मिली।")

              sys.exit(1)


          print("📂 Reading quotes-data.js...")


          # --------------------------------------
          # READ FILE
          # --------------------------------------

          with open(
              FILE,
              "r",
              encoding="utf-8"
          ) as f:

              content = f.read()


          # --------------------------------------
          # FIND quotesData ARRAY
          # --------------------------------------

          match = re.search(
              r'const\s+quotesData\s*=\s*(\[.*?\])\s*;',
              content,
              re.DOTALL
          )


          if not match:

              print(
                  "❌ Error: quotesData array नहीं मिली।"
              )

              sys.exit(1)


          array_text = match.group(1)


          # --------------------------------------
          # CONVERT JSON
          # --------------------------------------

          try:

              data = json.loads(
                  array_text
              )

          except Exception as error:

              print(
                  "❌ Error: quotes-data.js पढ़ा नहीं जा सका।"
              )

              print(
                  "Details:",
                  error
              )

              sys.exit(1)


          # --------------------------------------
          # CHECK ARRAY
          # --------------------------------------

          if not isinstance(data, list):

              print(
                  "❌ Error: quotesData array नहीं है।"
              )

              sys.exit(1)


          # --------------------------------------
          # FIND LAST ID
          # --------------------------------------

          ids = []


          for item in data:

              if not isinstance(item, dict):
                  continue

              try:

                  current_id = int(
                      item.get(
                          "id",
                          0
                      )
                  )

                  ids.append(
                      current_id
                  )

              except Exception:

                  continue


          new_id = max(
              ids or [0]
          ) + 1


          # --------------------------------------
          # GET INPUTS
          # --------------------------------------

          title = os.environ.get(
              "TITLE",
              ""
          ).strip()


          category = os.environ.get(
              "CATEGORY",
              "Shayari"
          ).strip()


          text = os.environ.get(
              "TEXT",
              ""
          ).strip()


          author = os.environ.get(
              "AUTHOR",
              "Tehalka Quotes"
          ).strip()


          image_path = os.environ.get(
              "IMAGE_PATH",
              ""
          ).strip()


          # --------------------------------------
          # VALIDATION
          # --------------------------------------

          if not title:

              print(
                  "❌ Title खाली है।"
              )

              sys.exit(1)


          if not text:

              print(
                  "❌ Shayari text खाली है।"
              )

              sys.exit(1)


          if not image_path:

              print(
                  "❌ Image path खाली है।"
              )

              sys.exit(1)


          if not author:

              author = "Tehalka Quotes"


          # --------------------------------------
          # NORMALIZE IMAGE PATH
          # --------------------------------------

          image_path = image_path.replace(
              "\\",
              "/"
          )


          if not image_path.startswith(
              "images/"
          ):

              image_path = (
                  "images/" +
                  image_path.lstrip("/")
              )


          # --------------------------------------
          # CREATE NEW SHAYARI
          # --------------------------------------

          new_shayari = {

              "id":
                  new_id,

              "title":
                  title,

              "category":
                  category,

              "text":
                  text,

              "author":
                  author,

              "image":
                  image_path
          }


          # --------------------------------------
          # ADD TO DATA
          # --------------------------------------

          data.append(
              new_shayari
          )


          # --------------------------------------
          # CREATE NEW FILE
          # --------------------------------------

          new_content = (
              "const quotesData = "
              +
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=4
              )
              +
              ";\n"
          )


          # --------------------------------------
          # SAVE
          # --------------------------------------

          with open(
              FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  new_content
              )


          # --------------------------------------
          # SUCCESS
          # --------------------------------------

          print("")
          print("====================================")
          print("✅ SHAYARI ADDED SUCCESSFULLY")
          print("====================================")
          print("ID       :", new_id)
          print("Title    :", title)
          print("Category :", category)
          print("Author   :", author)
          print("Image    :", image_path)
          print("====================================")


          PY


      # ==========================================
      # CHECK CHANGES
      # ==========================================

      - name: Check changes
        run: |

          echo "Checking modified files..."

          git status

          git diff -- quotes-data.js


      # ==========================================
      # COMMIT & PUSH
      # ==========================================

      - name: Commit and push changes
        run: |

          git config user.name "Tehalka Quotes"

          git config user.email "actions@github.com"

          git add quotes-data.js

          if git diff --cached --quiet; then

            echo "⚠️ कोई नया बदलाव नहीं मिला।"

            exit 0

          fi

          git commit \
            -m "Add new Shayari"

          git push


      # ==========================================
      # DONE
      # ==========================================

      - name: Finished
        run: |

          echo ""
          echo "===================================="
          echo "🎉 Tehalka Quotes Update Complete"
          echo "===================================="
          echo "quotes-data.js successfully updated."
          echo "===================================="
