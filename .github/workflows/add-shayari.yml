name: Add Shayari

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Shayari Title"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: choice
        options:
          - Love
          - Sad
          - Life
          - Motivational
          - Attitude
          - Friendship
          - Shayari

      text:
        description: "Shayari Text"
        required: true
        type: string

      author:
        description: "Author"
        required: false
        default: "Tehalka Quotes"
        type: string

permissions:
  contents: write

jobs:
  add-shayari:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Shayari
        env:
          TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          TEXT: ${{ inputs.text }}
          AUTHOR: ${{ inputs.author }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import subprocess
          import tempfile

          file = "quotes-data.js"

          title = os.environ["TITLE"]
          category = os.environ["CATEGORY"]
          text = os.environ["TEXT"]
          author = os.environ["AUTHOR"] or "Tehalka Quotes"

          # Read existing JavaScript file
          with open(file, "r", encoding="utf-8") as f:
              content = f.read()

          # Extract the array from quotes-data.js
          match = re.search(
              r'const\s+quotesData\s*=\s*(\[[\s\S]*\])\s*;?',
              content
          )

          if not match:
              raise Exception(
                  "quotes-data.js में const quotesData = [...] नहीं मिला।"
              )

          array_text = match.group(1)

          # Use Node.js to safely read the JavaScript array
          node_script = r'''
          const fs = require("fs");
          const vm = require("vm");

          const source = fs.readFileSync(
              process.argv[1],
              "utf8"
          );

          const sandbox = {};
          vm.createContext(sandbox);

          vm.runInContext(
              source + "\nthis.__quotesData = quotesData;",
              sandbox
          );

          console.log(
              JSON.stringify(sandbox.__quotesData)
          );
          '''

          with tempfile.NamedTemporaryFile(
              mode="w",
              suffix=".js",
              delete=False,
              encoding="utf-8"
          ) as temp:
              temp.write(content)
              temp_path = temp.name

          result = subprocess.run(
              ["node", "-e", node_script, temp_path],
              capture_output=True,
              text=True
          )

          if result.returncode != 0:
              print(result.stderr)
              raise Exception(
                  "quotes-data.js पढ़ने में समस्या आई।"
              )

          data = json.loads(result.stdout)

          # Create new ID
          new_id = max(
              [item.get("id", 0) for item in data] or [0]
          ) + 1

          # Add new Shayari
          data.append({
              "id": new_id,
              "title": title,
              "category": category,
              "text": text,
              "author": author
          })

          # Save JavaScript file
          new_content = (
              "const quotesData = "
              + json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=4
              )
              + ";\n"
          )

          with open(
              file,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(new_content)

          print("Shayari successfully added!")
          print("Title:", title)
          print("Category:", category)

          PY

      - name: Save Shayari
        run: |
          git config user.name "Tehalka Quotes"
          git config user.email "actions@github.com"

          git add quotes-data.js

          git diff --cached --quiet || git commit -m "Add new Shayari"

          git push
