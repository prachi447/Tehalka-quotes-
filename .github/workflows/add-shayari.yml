name: Add Shayari

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Shayari Title"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: choice
        options:
          - Love
          - Sad
          - Life
          - Motivational
          - Attitude
          - Friendship
          - Shayari

      text:
        description: "Shayari Text"
        required: true
        type: string

      author:
        description: "Author"
        required: false
        default: "Tehalka Quotes"
        type: string

      image_path:
        description: "Image path inside images folder"
        required: true
        type: string

permissions:
  contents: write

jobs:

  add-shayari:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Shayari to quotes-data.js
        env:
          TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          TEXT: ${{ inputs.text }}
          AUTHOR: ${{ inputs.author }}
          IMAGE_PATH: ${{ inputs.image_path }}

        run: |

          python - <<'PY'

          import os
          import json
          import re

          file = "quotes-data.js"

          print("Reading quotes-data.js...")

          with open(
              file,
              "r",
              encoding="utf-8"
          ) as f:
              content = f.read()

          match = re.search(
              r'const\s+quotesData\s*=\s*(\[.*\])\s*;',
              content,
              re.DOTALL
          )

          if not match:
              print("Error: quotesData array नहीं मिली।")
              exit(1)

          array_text = match.group(1)

          try:

              data = json.loads(array_text)

          except Exception as error:

              print(
                  "Error: quotes-data.js पढ़ा नहीं जा सका।"
              )

              print(error)

              exit(1)

          if not isinstance(data, list):

              print(
                  "Error: quotesData एक array नहीं है।"
              )

              exit(1)

          ids = []

          for item in data:

              try:

                  ids.append(
                      int(item.get("id", 0))
                  )

              except Exception:

                  pass

          new_id = max(ids or [0]) + 1

          new_shayari = {

              "id":
                  new_id,

              "title":
                  os.environ["TITLE"],

              "category":
                  os.environ["CATEGORY"],

              "text":
                  os.environ["TEXT"],

              "author":
                  os.environ["AUTHOR"]
                  or "Tehalka Quotes",

              "image":
                  os.environ["IMAGE_PATH"]

          }

          data.append(new_shayari)

          new_content = (
              "const quotesData = "
              +
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=4
              )
              +
              ";\n"
          )

          with open(
              file,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(new_content)

          print("✅ Shayari added successfully!")
          print("New ID:", new_id)
          print("Image:", os.environ["IMAGE_PATH"])

          PY

      - name: Save changes
        run: |

          git config user.name "Tehalka Quotes"

          git config user.email "actions@github.com"

          git add quotes-data.js

          git diff --cached --quiet || \
          git commit -m "Add new Shayari"

          git push
