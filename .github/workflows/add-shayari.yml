name: Add Shayari
run-name: Add Shayari

on:
  workflow_dispatch:
    inputs:

      title:
        description: "Shayari Title"
        required: true
        type: string

      category:
        description: "Category"
        required: true
        type: choice
        options:
          - Love
          - Sad
          - Life
          - Motivational
          - Attitude
          - Friendship
          - Shayari

      text:
        description: "Shayari Text"
        required: true
        type: string

      author:
        description: "Author"
        required: false
        default: "Tehalka Quotes"
        type: string


permissions:
  contents: write


jobs:

  add-shayari:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # ADD SHAYARI + AUTOMATIC IMAGE
      # ==========================================

      - name: Add Shayari and automatic image

        env:
          TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          TEXT: ${{ inputs.text }}
          AUTHOR: ${{ inputs.author }}

        run: |

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");
          const vm = require("vm");


          // ==========================================
          // FILES
          // ==========================================

          const DATA_FILE = "quotes-data.js";
          const IMAGE_FOLDER = "images";


          console.log("======================================");
          console.log("       TEHALKA QUOTES");
          console.log("       ADD NEW SHAYARI");
          console.log("======================================");


          // ==========================================
          // CHECK DATA FILE
          // ==========================================

          if (!fs.existsSync(DATA_FILE)) {

              console.error(
                  "❌ quotes-data.js नहीं मिली।"
              );

              process.exit(1);

          }


          // ==========================================
          // READ DATA FILE
          // ==========================================

          let content = fs.readFileSync(
              DATA_FILE,
              "utf8"
          );


          // ==========================================
          // CREATE SAFE JS CONTEXT
          // ==========================================

          const context = {

              window: {},

              console: console

          };


          vm.createContext(context);


          // ==========================================
          // SUPPORT BOTH:
          //
          // window.quotesData = [...]
          //
          // const quotesData = [...]
          //
          // ==========================================

          content = content.replace(
              /^\s*const\s+quotesData\s*=/m,
              "window.quotesData ="
          );


          content = content.replace(
              /^\s*let\s+quotesData\s*=/m,
              "window.quotesData ="
          );


          content = content.replace(
              /^\s*var\s+quotesData\s*=/m,
              "window.quotesData ="
          );


          // ==========================================
          // READ JAVASCRIPT
          // ==========================================

          try {

              vm.runInContext(
                  content,
                  context
              );

          } catch (error) {

              console.error(
                  "❌ quotes-data.js पढ़ने में समस्या।"
              );

              console.error(
                  error.message
              );

              process.exit(1);

          }


          // ==========================================
          // GET QUOTES
          // ==========================================

          let data =
              context.window.quotesData;


          if (!Array.isArray(data)) {

              console.error(
                  "❌ quotesData array नहीं मिली।"
              );

              process.exit(1);

          }


          console.log(
              "✅ Existing quotes:",
              data.length
          );


          // ==========================================
          // INPUTS
          // ==========================================

          const title =
              (process.env.TITLE || "").trim();


          const category =
              (process.env.CATEGORY || "Shayari").trim();


          const text =
              (process.env.TEXT || "").trim();


          let author =
              (process.env.AUTHOR || "Tehalka Quotes").trim();


          // ==========================================
          // VALIDATION
          // ==========================================

          if (!title) {

              console.error(
                  "❌ Shayari Title खाली है।"
              );

              process.exit(1);

          }


          if (!text) {

              console.error(
                  "❌ Shayari Text खाली है।"
              );

              process.exit(1);

          }


          if (!author) {

              author = "Tehalka Quotes";

          }


          // ==========================================
          // FIND NEXT ID
          // ==========================================

          let maxId = 0;


          for (const item of data) {

              if (
                  item &&
                  typeof item === "object"
              ) {

                  const id =
                      Number(item.id);


                  if (
                      Number.isFinite(id) &&
                      id > maxId
                  ) {

                      maxId = id;

                  }

              }

          }


          const newId =
              maxId + 1;


          console.log(
              "🆔 New ID:",
              newId
          );


          // ==========================================
          // CREATE IMAGES FOLDER
          // ==========================================

          fs.mkdirSync(
              IMAGE_FOLDER,
              {
                  recursive: true
              }
          );


          // ==========================================
          // IMAGE FILE
          // ==========================================

          const imageFilename =
              "quote-" +
              newId +
              ".svg";


          const imagePath =
              path.join(
                  IMAGE_FOLDER,
                  imageFilename
              );


          // ==========================================
          // ESCAPE SVG TEXT
          // ==========================================

          function escapeXML(value) {

              return String(value || "")
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&apos;");

          }


          // ==========================================
          // WRAP TEXT
          // ==========================================

          function wrapText(
              value,
              maxCharacters
          ) {

              const words =
                  String(value || "")
                  .split(/\s+/);


              const lines = [];

              let line = "";


              for (const word of words) {

                  const test =
                      line
                      ? line + " " + word
                      : word;


                  if (
                      test.length >
                      maxCharacters
                  ) {

                      if (line) {

                          lines.push(line);

                      }

                      line = word;

                  } else {

                      line = test;

                  }

              }


              if (line) {

                  lines.push(line);

              }


              return lines.length
                  ? lines
                  : [String(value || "")];

          }


          const lines =
              wrapText(
                  text,
                  32
              );


          // ==========================================
          // CREATE SVG TEXT
          // ==========================================

          let quoteText = "";


          const startY =
              500 -
              ((lines.length - 1) * 34);


          lines.forEach(
              function(line, index) {

                  const y =
                      startY +
                      (index * 68);


                  quoteText += `
          <text
              x="540"
              y="${y}"
              text-anchor="middle"
              class="quote"
          >${escapeXML(line)}</text>
          `;

              }
          );


          // ==========================================
          // CATEGORY ICON
          // ==========================================

          const icons = {

              Love: "❤️",

              Sad: "😔",

              Life: "🌿",

              Motivational: "💪",

              Attitude: "🔥",

              Friendship: "🤝",

              Shayari: "📝"

          };


          const categoryIcon =
              icons[category] || "✨";


          // ==========================================
          // CREATE AUTOMATIC IMAGE
          // ==========================================

          const svg = `<?xml version="1.0" encoding="UTF-8"?>

          <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1080"
          height="1080"
          viewBox="0 0 1080 1080">

          <defs>

          <linearGradient
          id="background"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%">

          <stop
          offset="0%"
          stop-color="#17181d"/>

          <stop
          offset="50%"
          stop-color="#6a11cb"/>

          <stop
          offset="100%"
          stop-color="#2575fc"/>

          </linearGradient>

          <linearGradient
          id="overlay"
          x1="0%"
          y1="0%"
          x2="0%"
          y2="100%">

          <stop
          offset="0%"
          stop-color="#000000"
          stop-opacity="0.10"/>

          <stop
          offset="100%"
          stop-color="#000000"
          stop-opacity="0.65"/>

          </linearGradient>

          </defs>


          <rect
          width="1080"
          height="1080"
          fill="url(#background)"/>


          <rect
          width="1080"
          height="1080"
          fill="url(#overlay)"/>


          <text
          x="540"
          y="85"
          text-anchor="middle"
          class="brand">

          Tehalka Quotes

          </text>


          <text
          x="540"
          y="145"
          text-anchor="middle"
          class="category">

          ${escapeXML(categoryIcon)}
          ${escapeXML(category)}

          </text>


          ${quoteText}


          <line
          x1="350"
          y1="820"
          x2="730"
          y2="820"
          stroke="#ffffff"
          stroke-opacity="0.35"
          stroke-width="2"/>


          <text
          x="540"
          y="880"
          text-anchor="middle"
          class="author">

          — ${escapeXML(author)}

          </text>


          <text
          x="540"
          y="945"
          text-anchor="middle"
          class="title">

          ${escapeXML(title)}

          </text>


          <text
          x="540"
          y="1015"
          text-anchor="middle"
          class="website">

          Tehalka Quotes

          </text>


          <style>

          .brand {

              font-family:
                  Arial,
                  "Noto Sans Devanagari",
                  sans-serif;

              font-size:
                  36px;

              font-weight:
                  bold;

              fill:
                  #ffd54a;

          }


          .category {

              font-family:
                  Arial,
                  "Noto Sans Devanagari",
                  sans-serif;

              font-size:
                  28px;

              font-weight:
                  bold;

              fill:
                  #ffffff;

          }


          .quote {

              font-family:
                  Arial,
                  "Noto Sans Devanagari",
                  sans-serif;

              font-size:
                  42px;

              font-weight:
                  bold;

              fill:
                  #ffffff;

          }


          .author {

              font-family:
                  Arial,
                  "Noto Sans Devanagari",
                  sans-serif;

              font-size:
                  26px;

              fill:
                  #eeeeee;

          }


          .title {

              font-family:
                  Arial,
                  "Noto Sans Devanagari",
                  sans-serif;

              font-size:
                  22px;

              fill:
                  #dddddd;

          }


          .website {

              font-family:
                  Arial,
                  sans-serif;

              font-size:
                  18px;

              fill:
                  #bbbbbb;

          }

          </style>

          </svg>`;


          fs.writeFileSync(
              imagePath,
              svg,
              "utf8"
          );


          console.log(
              "🖼️ Automatic image created:",
              imagePath
          );


          // ==========================================
          // CREATE NEW QUOTE
          // ==========================================

          const newQuote = {

              id: newId,

              title: title,

              category: category,

              text: text,

              author: author,

              image:
                  "images/" +
                  imageFilename

          };


          // ==========================================
          // ADD QUOTE
          // ==========================================

          data.push(
              newQuote
          );


          // ==========================================
          // SAVE quotes-data.js
          // ==========================================

          const newContent =
              "window.quotesData = " +
              JSON.stringify(
                  data,
                  null,
                  4
              ) +
              ";\n";


          fs.writeFileSync(
              DATA_FILE,
              newContent,
              "utf8"
          );


          // ==========================================
          // SUCCESS
          // ==========================================

          console.log("");
          console.log("======================================");
          console.log("✅ SHAYARI ADDED SUCCESSFULLY");
          console.log("======================================");
          console.log("ID       :", newId);
          console.log("Title    :", title);
          console.log("Category :", category);
          console.log("Author   :", author);
          console.log(
              "Image    :",
              "images/" + imageFilename
          );
          console.log("======================================");

          NODE


      # ==========================================
      # CHECK FILES
      # ==========================================

      - name: Check generated files

        run: |

          echo "Checking files..."

          echo ""
          echo "quotes-data.js:"
          ls -lh quotes-data.js

          echo ""
          echo "images folder:"
          ls -lh images/

          echo ""
          echo "Git status:"
          git status


      # ==========================================
      # COMMIT AND PUSH
      # ==========================================

      - name: Commit and push changes

        run: |

          git config user.name "Tehalka Quotes"

          git config user.email "actions@github.com"


          git add quotes-data.js

          git add images/


          if git diff --cached --quiet; then

            echo "⚠️ कोई नया बदलाव नहीं मिला।"

            exit 0

          fi


          git commit \
            -m "Add new Shayari and automatic image"


          git push


      # ==========================================
      # FINISHED
      # ==========================================

      - name: Finished

        run: |

          echo ""
          echo "======================================"
          echo "🎉 TEHALKA QUOTES UPDATE COMPLETE"
          echo "======================================"
          echo "✅ Shayari added"
          echo "✅ Automatic image created"
          echo "✅ quotes-data.js updated"
          echo "✅ Image saved"
          echo "✅ Changes pushed to main"
          echo "======================================"
